<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121d19">
  <title>115學年度九年級資訊科技</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #121d19;
      --panel: #1d2b24;
      --line: #3c4c40;
      --text: #f8f2e4;
      --muted: #c3cdc1;
      --accent: #f2c77c;
      font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: radial-gradient(ellipse at 76% 0%, #23352b, transparent 45rem), var(--background);
      background-repeat: no-repeat;
    }

    .page {
      width: min(100% - 64px, 1180px);
      margin-inline: auto;
      padding-block: 33px 40px;
    }

    .course-label {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 21px;
      color: var(--text);
      font-size: 0.9375rem;
      font-weight: 650;
      letter-spacing: 0.035em;
    }

    .course-mark {
      display: grid;
      flex: 0 0 37px;
      width: 37px;
      height: 37px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--accent);
      background: var(--panel);
      font: 700 0.8125rem ui-monospace, Consolas, monospace;
      letter-spacing: -0.08em;
    }

    .cover {
      position: relative;
      overflow: hidden;
      min-height: 500px;
      display: grid;
      align-items: center;
      grid-template-columns: 1fr 1.05fr;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--panel);
      box-shadow: 0 18px 45px #06110b55;
    }

    .cover-art {
      position: absolute;
      inset: 0 0 0 43%;
      overflow: hidden;
      background: radial-gradient(ellipse at 65% 47%, #4f6349, #273b30 58%, #1d2b24);
    }

    .cover-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 57%;
    }

    .cover-art::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #1d2b24, #1d2b2400 25%),
                  linear-gradient(0deg, #111d1780, transparent 30%);
      pointer-events: none;
    }

    .cover-copy {
      position: relative;
      z-index: 1;
      padding: 54px clamp(32px, 5vw, 64px);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.625rem, 5vw, 4.5rem);
      font-weight: 850;
      line-height: 1.11;
      letter-spacing: -0.045em;
    }

    .title-python {
      display: block;
      margin-bottom: 0.11em;
      color: var(--accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.36em;
      font-weight: 700;
      line-height: 0.96;
      letter-spacing: -0.07em;
    }

    .intro {
      max-width: 22em;
      margin: 23px 0 29px;
      color: var(--muted);
      font-size: 1.0625rem;
      line-height: 1.8;
    }

    .start {
      display: inline-flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 12px 19px;
      border-radius: 12px;
      color: #23190d;
      background: var(--accent);
      font-size: 1rem;
      font-weight: 750;
      text-decoration: none;
    }

    .start:hover { background: #ffdab0; }
    .start:focus-visible { outline: 3px solid var(--text); outline-offset: 4px; }
    .start-arrow { font-size: 1.3em; line-height: 1; }

    .route {
      margin-top: 28px;
      padding: 22px 25px 23px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--panel);
    }

    .route h2 {
      margin: 0 0 18px;
      font-size: 1.0625rem;
      letter-spacing: 0.04em;
    }

    .route-steps {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px 20px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .route-steps li {
      position: relative;
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-weight: 650;
      font-size: 0.9375rem;
    }

    .route-steps li:not(:last-child)::after {
      content: "";
      position: absolute;
      inset-inline-end: -3px;
      width: 6px;
      height: 6px;
      border: solid #849586;
      border-width: 1px 1px 0 0;
      transform: rotate(45deg);
    }

    .step-icon {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid #4d604e;
      border-radius: 9px;
      color: var(--accent);
      background: #27382e;
      font: 650 1.125rem system-ui, sans-serif;
      line-height: 1;
    }

    @media (max-width: 980px) {
      .route-steps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .route-steps li:nth-child(3)::after { display: none; }
    }

    @media (max-width: 720px) {
      .page { width: calc(100% - 32px); padding-block: 21px 28px; }
      .course-label { margin-bottom: 15px; }
      .cover { min-height: 0; grid-template-columns: minmax(0, 1fr); border-radius: 21px; }
      .cover-copy { padding: 34px 25px 11px; }
      .cover-art { position: relative; inset: auto; height: clamp(186px, 58vw, 300px); }
      .cover-art img { object-position: center 56%; }
      .cover-art::after { background: linear-gradient(180deg, #1d2b24, transparent 28%); }
      h1 { font-size: clamp(2.25rem, 8.2vw, 3.75rem); }
      .intro { margin-block: 16px 21px; font-size: 1rem; }
      .route { margin-top: 18px; padding: 17px; }
    }

    @media (max-width: 530px) {
      .route-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .route-steps li::after { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="course-label"><span class="course-mark" aria-hidden="true">&gt;_</span>115學年度九年級資訊科技</p>
    <section class="cover" aria-labelledby="cover-title">
      <div class="cover-copy">
        <h1 id="cover-title"><span class="title-python">Python</span> 畢旅冒險</h1>
        <p class="intro">從輸出、變數與輸入開始，練習條件判斷和迴圈，用 Python 完成旅途中的任務。</p>
        <a class="start" href="student/python.html">開始 Python 冒險 <span class="start-arrow" aria-hidden="true">→</span></a>
      </div>
      <div class="cover-art" aria-hidden="true">
        <img src="images/python-trail.webp" alt="" width="1254" height="1254" fetchpriority="high">
      </div>
    </section>
    <section class="route" aria-labelledby="route-title">
      <h2 id="route-title">闖關路線</h2>
      <ol class="route-steps" role="list">
        <li><span class="step-icon" aria-hidden="true">⌁</span>挑戰</li>
        <li><span class="step-icon" aria-hidden="true">☆</span>收集星星</li>
        <li><span class="step-icon" aria-hidden="true">◇</span>開啟寶箱</li>
        <li><span class="step-icon" aria-hidden="true">↗</span>解鎖新任務</li>
        <li><span class="step-icon" aria-hidden="true">✓</span>完成闖關</li>
        <li><span class="step-icon" aria-hidden="true">◎</span>領取證書</li>
      </ol>
    </section>
  </main>
</body>
</html>
